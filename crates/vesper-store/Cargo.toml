[package]
name = "vesper-store"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The only crate that imports sqlx (ADR 0005). Runtime queries only: no `query!`, so no .sqlx cache.
[dependencies]
getrandom = "0.3"
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
vesper-protocol.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
