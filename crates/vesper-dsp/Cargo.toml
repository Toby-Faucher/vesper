[package]
name = "vesper-dsp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
tract = ["deep_filter/tract"]
wasm = ["tract", "deep_filter/wasm", "dep:wasm-bindgen"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false }
ndarray = "0.15"
# Do NOT `cargo update` tract: newer 0.21.x breaks the deep_filter build. The exact pin on
# tract-core forces the rest of the tract-* family (all share its version) to stay on 0.21.4.
tract-core = "=0.21.4"

[lints]
workspace = true
