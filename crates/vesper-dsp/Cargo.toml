[package]
name = "vesper-dsp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
tract = ["deep_filter/tract"]
# Not `deep_filter/wasm`: it adds its own JS exports and a panic hook we do not use. `tract` pulls `rand` (tract-onnx-opl),
# which needs getrandom's `js` backend on wasm32-unknown-unknown.
wasm = ["tract", "dep:wasm-bindgen", "dep:getrandom"]
# Config (de)serialisation for the audio lab. Off for the WASM build.
serde = ["dep:serde"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
serde = { workspace = true, optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false }
ndarray = "0.15"
# Do NOT `cargo update` tract: newer 0.21.x breaks the deep_filter build. The exact pin on
# tract-core forces the rest of the tract-* family (all share its version) to stay on 0.21.4.
tract-core = "=0.21.4"

[lints]
workspace = true
