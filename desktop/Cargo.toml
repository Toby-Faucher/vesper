# The v2 desktop client (GPUI). Its own workspace and lockfile, so GPUI's dependency tree never moves the server's
# pins (tract, sqlx, time). Shares wire types with the server through the vesper-protocol path dependency.
[workspace]
# vendor/ holds patched copies of upstream crates (each says why in its PATCHED.txt); they are not members.
exclude = ["vendor"]

[package]
name = "vesper-desktop"
version = "2.3.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
device_query = "4.0.1"
dirs = "6"
# A share's picture: scaled down in RGB (SIMD), then turned into I420 for the encoder (yuv, SIMD).
fast_image_resize = "6.1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4.2"
log = { version = "0.4", features = ["std"] }
opus = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls-no-provider", "charset", "http2", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sonora = "0.3.0"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
sys-locale = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# Do NOT `cargo update` tract: the same pin as crates/vesper-dsp (newer 0.21.x breaks the deep_filter build).
tract-core = "=0.21.4"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
url = "2"
vesper-dsp = { version = "2.3.2", path = "../crates/vesper-dsp", features = ["tract"] }
vesper-protocol = { version = "2.3.2", path = "../crates/vesper-protocol" }
vp8-decoder = "=0.1.1"
# Sending a screen share: libvpx's VP8 encoder in realtime mode, linked statically from desktop/.libvpx
# (scripts/build-libvpx.sh, docs/dev.md).
vpx-rs = "0.2.1"
yuv = "0.8.20"

# Screen capture (desktop/src/voice/capture.rs): Windows Graphics Capture on Windows; on Linux the ScreenCast portal
# (ashpd, already in GPUI's tree) and a PipeWire stream under Wayland, and x11rb (also GPUI's) under X11.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
pipewire = "0.9"
x11rb = { version = "0.13", features = ["randr"] }
# Notifications (src/notify.rs) and the launcher's unread count (src/badge.rs), over zbus, already in GPUI's tree.
zbus = { version = "5", default-features = false, features = ["async-io"] }

# The single instance check's named pipe on Windows (src/single.rs).
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net"] }
# Toasts with a click handler (src/notify.rs).
tauri-winrt-notification = "0.8"
# The toasts' app id under HKCU (src/notify.rs). Already in the tree through gpui's own manifest.
windows-registry = "0.5"

# The exe's icon (build.rs). Already in the tree through gpui's own manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# A pure Rust VP8 encoder for the tests' fake shares (tests/share.rs, the engine and video tests).
vp8-encoder = "=0.1.1"

# The real-server tests (tests/server.rs, tests/voice.rs) need the server crates, which use Unix file permissions.
# Windows CI runs the unit and headless GPUI tests only.
[target.'cfg(unix)'.dev-dependencies]
vesper-server = { path = "../crates/vesper-server" }
vesper-sfu = { path = "../crates/vesper-sfu" }
vesper-store = { path = "../crates/vesper-store" }

# tract 0.21.4 trips a debug-only assertion on the DeepFilterNet3 model ("duplicate name /convt3/Conv.bias"); the
# same override as the root Cargo.toml. Remove both once tract is upgraded past the bug.
[profile.release]
lto = "thin"
strip = true

[profile.dev.package.tract-core]
debug-assertions = false

# A debug build decodes a 1080p share too slowly to keep up; optimise the decoder alone.
[profile.dev.package.vp8-decoder]
opt-level = 3

# The same for the echo canceller, which runs on every 10 ms of the microphone.
[profile.dev.package.sonora]
opt-level = 3

[profile.dev.package.sonora-aec3]
opt-level = 3

[profile.dev.package.sonora-fft]
opt-level = 3

# GPUI 0.2.2 with one fix: on Wayland its frame loop committed the window 60 times a second even when nothing changed.
# vendor/gpui/PATCHED.txt says what changed. Drop this once a gpui release on crates.io parks the loop itself.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
# gpui-component 0.5.1 with one fix: an input that was not focused still redrew the window on every caret blink.
gpui-component = { path = "vendor/gpui-component" }
# env-libvpx-sys 5.1.3 on a newer bindgen: its own made libvpx's config structs opaque with libclang 23.
env-libvpx-sys = { path = "vendor/env-libvpx-sys" }
# vpx-rs 0.2.1 with one fix: it passed cpu-used to libvpx as a pointer, so the encoder's speed was never set.
vpx-rs = { path = "vendor/vpx-rs" }

