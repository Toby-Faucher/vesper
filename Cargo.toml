[workspace]
resolver = "2"
members = ["crates/vesper-protocol", "crates/vesper-dsp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"

# tract 0.21.4 trips a debug-only "duplicate name" assertion on the DeepFilterNet3 model.
[profile.dev.package.tract-core]
debug-assertions = false
