[workspace]
resolver = "2"
members = ["crates/vesper-protocol", "crates/vesper-dsp", "crates/vesper-sfu", "crates/vesper-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"

# tract 0.21.4 trips a debug-only assertion on the DeepFilterNet3 model:
# "duplicate name /convt3/Conv.bias" (release builds are fine). Remove this override once
# tract is upgraded past the bug and debug-build tests pass without it.
[profile.dev.package.tract-core]
debug-assertions = false
