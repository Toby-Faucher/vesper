name: desktop-package
# Builds of the desktop client people can download, kept as workflow artifacts for 30 days: Windows (a zip and an
# installer) and Linux (a tarball with install.sh, and an AppImage). The last job puts them together with SHA256SUMS,
# which the app's updater checks a download against. Runs on pushes to the v2 branch, on release and desktop tags, or
# by hand. A release attaches its tag's `vesper-desktop-release-<commit>` files to the GitHub release by hand
# (docs/versions.md).
on:
  push:
    branches: [v2/desktop]
    tags: ['desktop-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update
      # Static libvpx from vcpkg for the share encoder (scripts/build-libvpx.sh), kept until the script changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.libvpx
          key: libvpx-v1-${{ runner.os }}-${{ hashFiles('scripts/build-libvpx.sh') }}
      - run: scripts/build-libvpx.sh
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop
          key: release
          # Tag runs cannot read each other's caches (GitHub scopes caches to the ref and main), so saving one only
          # fills the 10 GB limit and pushes out ci's caches.
          save-if: false
      - run: cargo build --release --locked
        working-directory: desktop
      - name: Package
        run: |
          mkdir -p dist/Vesper
          cp desktop/target/release/vesper-desktop.exe dist/Vesper/Vesper.exe
          cp desktop/package/README.txt dist/Vesper/README.txt
          cp LICENSE dist/Vesper/LICENSE.txt
          cp desktop/package/THIRD-PARTY.txt dist/Vesper/THIRD-PARTY.txt
          (cd dist && 7z a -tzip vesper-desktop-windows-x64.zip Vesper)
          ls -la dist dist/Vesper
      # Inno Setup is on the runner image; installed if a new image drops it.
      - name: Installer
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup --no-progress -y
          version=$(grep -m1 '^version = ' desktop/Cargo.toml | cut -d'"' -f2)
          "$iscc" "/DAppVersion=$version" "/DSource=$(cygpath -w "$PWD/dist/Vesper")" "/O$(cygpath -w "$PWD/dist")" \
            desktop/package/windows/vesper.iss
          ls -la dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vesper-desktop-windows-x64-${{ github.sha }}
          path: |
            dist/vesper-desktop-windows-x64.zip
            dist/vesper-desktop-windows-x64-setup.exe
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update
      - run: >-
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev
          libopus-dev libpipewire-0.3-dev libclang-dev pkg-config nasm
      # Static libvpx for the share encoder (scripts/build-libvpx.sh), so the packages need no libvpx on the machine.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.libvpx
          key: libvpx-v1-${{ runner.os }}-${{ hashFiles('scripts/build-libvpx.sh') }}
      - run: scripts/build-libvpx.sh
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop
          key: release
          # Tag runs cannot read each other's caches (GitHub scopes caches to the ref and main), so saving one only
          # fills the 10 GB limit and pushes out ci's caches.
          save-if: false
      - run: cargo build --release --locked
        working-directory: desktop
      # The binary must not ask for a shared libvpx (distros name it differently).
      - run: "! ldd desktop/target/release/vesper-desktop | grep -i vpx"
      - name: Package
        run: |
          mkdir -p dist/Vesper
          cp desktop/target/release/vesper-desktop dist/Vesper/vesper-desktop
          cp desktop/package/README-linux.txt dist/Vesper/README.txt
          cp desktop/package/THIRD-PARTY.txt dist/Vesper/THIRD-PARTY.txt
          cp LICENSE dist/Vesper/LICENSE.txt
          cp desktop/package/linux/install.sh desktop/package/linux/vesper.desktop dist/Vesper/
          cp -r desktop/package/icons dist/Vesper/icons
          tar -C dist -czf dist/vesper-desktop-linux-x64.tar.gz Vesper
          ls -la dist dist/Vesper
      # The same app as one file. appimagetool is pinned by version and hash.
      - name: AppImage
        run: |
          app=dist/AppDir
          install -Dm755 desktop/target/release/vesper-desktop "$app/usr/bin/vesper-desktop"
          cp desktop/package/linux/vesper.desktop "$app/vesper.desktop"
          cp desktop/package/icons/256.png "$app/vesper.png"
          for s in 16 24 32 48 64 128 256 512; do
            install -Dm644 "desktop/package/icons/$s.png" "$app/usr/share/icons/hicolor/${s}x${s}/apps/vesper.png"
          done
          ln -s usr/bin/vesper-desktop "$app/AppRun"
          curl -fsSLo appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$app" dist/vesper-desktop-linux-x64.AppImage
          ls -la dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vesper-desktop-linux-x64-${{ github.sha }}
          path: |
            dist/vesper-desktop-linux-x64.tar.gz
            dist/vesper-desktop-linux-x64.AppImage
          retention-days: 30

  # Every file a release attaches, and SHA256SUMS over them (the updater needs it, see desktop/src/update.rs).
  release-files:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vesper-desktop-*-x64-${{ github.sha }}
          merge-multiple: true
          path: release
      - run: |
          cd release
          sha256sum vesper-desktop-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4 # the four builds; SHA256SUMS itself makes the fifth file
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vesper-desktop-release-${{ github.sha }}
          path: release
          retention-days: 30
