name: ci
# Pushes to main and every pull request (one run per PR, not a second one for the branch push).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The step list lives in scripts/check.sh; CI runners are not the dev box, so the memory cap is off.
env:
  VESPER_NO_CAP: 1
  CARGO_TERM_COLOR: always

# Only e2e and dsp-wasm wait, for the few seconds of `changes`. e2e takes dsp-wasm's denoiser build as an artifact,
# polled once its own build is done; dsp-wasm uploads it before its tests, so e2e does not usually wait.
# Pull request runs restore main's caches but do not save their own: the repo's caches sit near the 10 GB limit.
jobs:
  # A pull request that only bumps the release version (scripts/version-only.py) skips e2e and dsp-wasm.
  # Anything else, any push to main, an error in the check, or this job failing runs everything. A job skipped
  # by `if:` reports "skipped", which a required status check treats as passing.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.gate.outputs.version_only }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The pull request merge commit and its first parent, the base branch tip.
          fetch-depth: 2
      # The base branch's copy of the script decides, so a PR cannot loosen the gate for itself. No copy on the base
      # (git show fails) means the full pipeline.
      - id: gate
        run: |
          exit 1 # throwaway: the gate job fails
          v=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git show HEAD^1:scripts/version-only.py >"$RUNNER_TEMP/version-only.py" &&
            python3 -I "$RUNNER_TEMP/version-only.py" HEAD^1 HEAD; then v=true; fi
          echo "version_only=$v" | tee -a "$GITHUB_OUTPUT"

  lint-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml (rustfmt, clippy, wasm32 target).
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner image ships shellcheck; install it anyway in case a new image drops it.
      - run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - run: scripts/check.sh fmt clippy shell scripts secrets wording

  test-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # bindings reruns the vesper-protocol export tests and diffs web/src/lib/gen against the commit.
      - run: scripts/check.sh test bindings

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: scripts/check.sh deny

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # 22 matches the deploy/Dockerfile web stage and the engines floor in web/package.json.
          # .nvmrc (26) is the author's local Node, not what the image builds with.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The build does not need web/public/dsp: the worker fetches /dsp/ at runtime.
      - run: scripts/check.sh web
      # Fails on high and critical advisories only; moderate and low are reported, not blocking.
      - run: npm audit --audit-level=high
        working-directory: web

  # Two headless Chromium browsers join one room through the release server; web/e2e/two-browser.mjs, then flows.mjs and ui.mjs.
  # No wasm build here: flows.mjs runs its denoiser-under-CSP step with dsp-wasm's build; the other steps use browser suppression.
  e2e:
    needs: changes
    # Runs unless `changes` succeeded and said version only: a failed `changes` runs everything.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the wait step lists this run's artifacts and jobs
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --release --locked -p vesper-server
      - run: npm ci && npm run build
        working-directory: web
      # playwright-core is pinned in web/package.json, so this fetches the matching Chromium.
      - run: npx playwright-core install --with-deps chromium
        working-directory: web
      # Polled rather than `needs: dsp-wasm`, which would add its 3 to 4 minutes to this job's start.
      - name: wait for the denoiser from dsp-wasm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in $(seq 120); do
            # Job state first: if it was done before the artifact check, a missing artifact is final.
            finished=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "dsp-wasm" and .status == "completed") | .name')
            gh api "$api/artifacts" --jq '.artifacts[].name' | grep -qx dsp && exit 0
            [ -z "$finished" ] || { echo "dsp-wasm finished without uploading dsp"; exit 1; }
            sleep 10
          done
          echo "no dsp artifact after 20 minutes"; exit 1
      # After npm run build, which empties dist/; the server reads dist/ at request time.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dsp
          path: web/dist/dsp
      - run: npm run e2e
        working-directory: web

  dsp-wasm:
    needs: changes
    # Runs unless `changes` succeeded and said version only: a failed `changes` runs everything.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      # The built web/public/dsp, keyed on everything the wasm build reads: the wasm-bindgen version is in Cargo.lock, the
      # model's sha256 in fetch-model.sh. Saved by green main runs only (last step). Before fetch-model.sh, so the model is not hashed.
      - id: dsp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/public/dsp
          key: dsp-wasm-v1-${{ runner.os }}-${{ hashFiles('crates/vesper-dsp/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/build-dsp.sh', 'scripts/fetch-model.sh') }}
      # The e2e job serves it for flows.mjs's denoiser-under-CSP step. Uploaded before the tests, so e2e does not wait for them.
      - if: steps.dsp-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dsp
          path: web/public/dsp
          if-no-files-found: error
          retention-days: 1
      - run: rustup toolchain install --no-self-update
      # Also caches ~/.cargo/bin, so the wasm-bindgen CLI below is only compiled on a cold cache.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # The CLI must equal the wasm-bindgen crate in Cargo.lock; read it the way scripts/build-dsp.sh does.
      - name: install wasm-bindgen CLI at the Cargo.lock version
        if: steps.dsp-cache.outputs.cache-hit != 'true'
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $3); print $3; exit}' Cargo.lock)
          test -n "$v"
          cargo install wasm-bindgen-cli --version "$v" --locked
          wasm-bindgen --version
      # The model is gitignored and the denoiser tests need it; fetch-model.sh checks its sha256.
      - run: scripts/fetch-model.sh
      - if: steps.dsp-cache.outputs.cache-hit != 'true'
        run: scripts/check.sh wasm
      - if: steps.dsp-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dsp
          path: web/public/dsp
          if-no-files-found: error
          retention-days: 1
      # With the wasm build above this is `scripts/check.sh dsp`; the tests run whether or not the cache hit.
      - run: scripts/check.sh denoiser audiolab
      - if: github.ref == 'refs/heads/main' && steps.dsp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/public/dsp
          key: ${{ steps.dsp-cache.outputs.cache-primary-key }}
