name: advisories
# New advisories land without any push, so check both lockfiles weekly too.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # same as ci.yml and the deploy/Dockerfile web stage
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # Fails on high and critical only.
      - run: npm audit --audit-level=high
        working-directory: web
