# Dockge / docker compose stack. Put VESPER_DEV_KEY and VESPER_PUBLIC_HOST in a .env next to this file.
# Build context is the repo root (this file lives in deploy/). Unverified: Dockge keeps each stack
# in its own directory, so `..` may not point at a repo clone there; check before the first deploy.
services:
  vesper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Tag builds (for example with the git sha) so a rollback has an image to point at:
    # VESPER_TAG=<tag> docker compose -f deploy/compose.yaml up -d
    image: vesper:${VESPER_TAG:-latest}
    restart: unless-stopped
    # The server is PID 1 and has no signal handler, so without an init `docker stop` waits 10 s
    # and then kills it.
    init: true
    # Docker's default json-file log has no size limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VESPER_DEV_KEY: ${VESPER_DEV_KEY:?set it in .env}
      VESPER_PUBLIC_HOST: ${VESPER_PUBLIC_HOST:?set it in .env}
      # VESPER_UDP_PORT_PUBLIC: 40000   # only if the router forwards a different external UDP port
      #   (do not set it empty: an empty value is a parse error)
      #
      # VESPER_PUBLIC_HOST must resolve to the PUBLIC IP *as seen from this host*. If your LAN DNS
      # overrides vesper.tfaucher.com with a LAN address (split DNS), use a public-only name
      # (e.g. media.tfaucher.com) or the literal public IP here. See docs/deploy.md.
    ports:
      # HTTP for the reverse proxy. Caddy on the same host: keep 127.0.0.1. Caddy on another host or
      # in another compose network: use "8080:8080" (LAN-visible, firewall it) or put both services
      # on a shared network and drop this line, pointing Caddy at vesper:8080.
      - "127.0.0.1:8080:8080"
      # Media: the router forwards UDP 40000 here. Must be published on all interfaces.
      - "40000:40000/udp"
    # Alternative if Docker's UDP NAT misbehaves: remove `ports:` and add `network_mode: host`; then the
    # server binds the host directly (VESPER_HTTP_BIND=127.0.0.1:8080 to keep HTTP local, and
    # VESPER_UDP_BIND=0.0.0.0:40000 as is). Published ports are ignored in host mode.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
