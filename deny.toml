# cargo deny check            (needs network for the RustSec advisory db)
# cargo deny check bans licenses sources    (offline subset)
# Schema: cargo-deny 0.20. Add a license or an advisory ignore only after reading why it applies.

[graph]
# No `targets` filter: vesper-dsp is also built for wasm32 in the Docker image, so scan it too.

[advisories]
unmaintained = "workspace"
yanked = "deny"
# Every ignore needs: advisory id, whether the code is reachable, a date and a TODO to remove it.
ignore = [
    # tract-nnef 0.21.4 (via deep_filter and tract-onnx): out-of-bounds read when parsing a crafted NNEF
    # .dat tensor. Not reachable: Vesper and deep_filter only call tract_onnx::onnx() loaders on the
    # pinned, sha256-checked DeepFilterNet3 and DNSMOS models, never the NNEF loader. Added 2026-10-31.
    # TODO: remove when tract moves past the =0.21.4 pin (see crates/vesper-dsp/Cargo.toml).
    { id = "RUSTSEC-2026-0217", reason = "NNEF loader not reachable; tract pinned at 0.21.4 for deep_filter" },
    # rsa 0.10.0-rc (Marvin timing attack on RSA private-key operations), via webauthn-rs and crypto-glue.
    # Not reachable: Vesper only verifies passkey signatures with the public key (RS256 credentials) and
    # never decrypts or signs with an RSA key. No patched version exists. Added 2026-11-03.
    # TODO: remove when rsa has a fix or webauthn-rs drops it.
    { id = "RUSTSEC-2023-0071", reason = "rsa private-key ops not used; only public-key signature checks for passkeys" },
    # libsqlite3-sys 0.37 (via sqlx-sqlite 0.9.0) bundles SQLite below 3.54: a crafted database and `-wal` pair with
    # different page sizes can return stale memory. Not reachable: Vesper only opens its own vesper.db in
    # VESPER_DATA_DIR (mode 0700, the server's user), so planting a -wal there needs the access that reads the
    # database anyway. sqlx 0.9.0 is the newest release and needs libsqlite3-sys 0.37. Added 2026-11-10.
    # TODO: remove when sqlx moves to libsqlite3-sys 0.39 or later.
    { id = "RUSTSEC-2026-0459", reason = "only our own data-dir database is opened; no sqlx release with libsqlite3-sys >= 0.39 yet" },
    # chrono (desktop app only) is unmaintained: no vulnerability, no fixed release. The app uses it to format local
    # times in the timeline, search dates and the log file. Added 2026-11-18.
    # TODO: replace chrono with jiff or time, then remove this.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, not a vulnerability; local time formatting in the desktop app" },
]

[licenses]
confidence-threshold = 0.93
# Workspace crates are MIT (LICENSE) and unpublished, so cargo-deny skips them.
private = { ignore = true }
# Only the licenses the current graph actually uses (checked with cargo deny).
allow = [
    "Apache-2.0",
    # The desktop app's tree (desktop/Cargo.lock), all permissive. Added 2026-11-18 when desktop joined the check.
    "Apache-2.0 WITH LLVM-exception", # stacker, psm (gpui's stack growth), cfg-expr
    "BSD-2-Clause", # tiny-skia (gpui's SVG icons), rav1e, av1-grain, arrayref (image's AVIF)
    "0BSD",         # enum-iterator (gpui-component)
    "CC0-1.0",      # const-random and others in gpui and naga
    "NCSA",         # part of rav1e's (MIT OR Apache-2.0) AND NCSA
    "Unlicense",    # a tray-icon dependency
    "BSD-3-Clause", # subtle, matchit, aws-lc-sys
    # webpki-roots: the Mozilla CA list as data, for TLS to the Web Push services (issue #58).
    "CDLA-Permissive-2.0",
    "ISC",          # aws-lc-rs, aws-lc-sys
    "MIT",
    "MPL-2.0",      # webauthn-rs and crypto-glue (passkeys, issue #151); file-level copyleft, used unmodified
    "Unicode-3.0",  # unicode-ident, unicode-normalization
    "Zlib",         # foldhash, via sqlx-core's hashlink
]

[bans]
# Duplicates are common in a webrtc + tract + wasm graph; show them, do not block.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Do not ban aws-lc-sys: str0m's aws-lc-rs backend needs it on purpose.
deny = [
    { crate = "openssl-sys", reason = "Vesper uses aws-lc-rs via str0m; a second TLS stack means a dependency changed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git dependency, pinned by rev in crates/vesper-dsp/Cargo.toml.
allow-git = ["https://github.com/Rikorose/DeepFilterNet"]
