# Audio lab research loop. Read by research/scripts/cfg.py. Protected: an attempt that edits it is broken.

[repo]
# Experiments branch from here. attempt.sh creates it from `source_branch` if it is missing,
# and writes the source tip into `origin_sha` (the ORIGINAL baseline for the final holdout check).
integration_branch = "research/audio-main"
source_branch = "research/audio-lab"
origin_sha = "308df0b4180051d660016d8a17884ee58398a182"

[paths]
# Relative to the repo root (the controller checkout).
# Corpus v2 (VCTK 48 kHz, built by `audiolab corpus build --name v2`). v1 was research/corpus/built.
corpus = "research/corpus48/built"
dnsmos = "research/models/sig_bak_ovr.onnx"
# UTMOS (second_mos): scored and reported when the file exists, not gated.
second_mos = "research/models/utmos22_strong.onnx"
model = "crates/vesper-dsp/model/DeepFilterNet3_onnx.tar.gz"
# Baseline config, read from the BASE commit (so stacked config changes move with the base).
default_config = "research/configs/default.toml"
# Gate scratch: cached binaries and eval JSON (git-ignored).
gate_cache = "research/results/gate"

[machine]
threads = 6
memory_cap_mib = 5120

[eval]
split = "gate"
determinism_items = 5

[sprt]
# Paired deltas of DNSMOS OVRL. H0: gain <= 0. H1: gain >= delta1.
delta0 = 0.0
delta1 = 0.02
alpha = 0.05
beta = 0.05
batch = 20

[stack]
# Gate a combination of already-run configs: `<id> = ["<exp id>", ...]`. The gate merges each listed
# experiment's pipeline.toml (research/experiments/<exp id>/ in this checkout, else its exp/<exp id>
# branch) and then <id>'s own, in that order; a key
# set to two values is broken. Code changes are not stacked here: cherry-pick them onto exp/<id>.
# Example: E10-stack = ["E3-beta05", "E2-atten24"]

[guards]
sig_mean_min = -0.03
# 10th percentile of the per-item SIG deltas.
sig_p10_min = -0.15
# Mean BAK delta. Stops a gain that only comes from leaving noise in.
bak_mean_min = -0.05
si_sdr_i_mean_min = -0.3
# Second judge: mean lsd_wb delta (dB, candidate minus baseline) must be at most this. A gain in
# DNSMOS OVRL that comes with more wideband spectral distortion is not accepted.
lsd_wb_mean_max = 0.05
rtf_max = 0.30
# Candidate RTF may be at most this many times the baseline RTF.
rtf_ratio_max = 1.25
# Extra algorithmic latency allowed, in samples at 48 kHz (5 ms), and only if hypothesis.md declares it.
latency_max_samples = 240

[paths_policy]
# A changed path must start with one of `allowed` and with none of `protected`.
# `{id}` is the experiment id.
allowed = ["crates/vesper-dsp/src/", "research/experiments/{id}/"]
protected = ["research/scripts/", "research/config.toml", "research/configs/", "research/corpus/",
             "research/models/", "research/CATALOG.md", "crates/vesper-audiolab/", "Cargo.toml",
             "Cargo.lock", "rust-toolchain", "deny.toml", ".github/", "web/", "docs/", "scripts/"]
